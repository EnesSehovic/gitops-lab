apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: openshift-gitops
spec:
  project: default

  source:
    repoURL: https://github.com/EnesSehovic/gitops-lab.git
    targetRevision: main
    path: apps/hello

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
